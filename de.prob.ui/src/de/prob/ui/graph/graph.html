<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ffffff;
    font-family: sans-serif; }
  #viewport { width: 100%; height: 100%; cursor: grab; }
  #viewport.dragging { cursor: grabbing; }
  #content { transform-origin: 0 0; display: inline-block; }
  g.node.clickable { cursor: pointer; -webkit-user-select: none; user-select: none; }
  g.node.clickable:hover polygon, g.node.clickable:hover ellipse,
  g.node.clickable:hover path { stroke-width: 3; }
</style>
</head>
<body>
<div id="viewport"><div id="content">%CONTENT%</div></div>
<script>
(function () {
  var viewport = document.getElementById('viewport');
  var content = document.getElementById('content');
  var scale = 1, x = 0, y = 0;

  function apply() {
    content.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + scale + ')';
  }

  // zoom around the point (px, py) of the viewport
  function zoomAt(factor, px, py) {
    var newScale = Math.min(20, Math.max(0.02, scale * factor));
    factor = newScale / scale;
    x = px - (px - x) * factor;
    y = py - (py - y) * factor;
    scale = newScale;
    apply();
  }

  window.probZoom = function (factor) {
    zoomAt(factor, viewport.clientWidth / 2, viewport.clientHeight / 2);
  };

  window.probFit = function () {
    var svg = content.querySelector('svg');
    if (!svg) { scale = 1; x = 0; y = 0; apply(); return; }
    var w = svg.getBoundingClientRect().width / scale;
    var h = svg.getBoundingClientRect().height / scale;
    if (w <= 0 || h <= 0) return;
    scale = Math.min(1, Math.min(viewport.clientWidth / w, viewport.clientHeight / h) * 0.95);
    x = (viewport.clientWidth - w * scale) / 2;
    y = (viewport.clientHeight - h * scale) / 2;
    apply();
  };

  viewport.addEventListener('wheel', function (e) {
    e.preventDefault();
    var r = viewport.getBoundingClientRect();
    zoomAt(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });

  var dragging = false, lastX = 0, lastY = 0;
  viewport.addEventListener('mousedown', function (e) {
    if (e.button !== 0) return;
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    viewport.classList.add('dragging');
  });
  window.addEventListener('mousemove', function (e) {
    if (!dragging) return;
    x += e.clientX - lastX; y += e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    apply();
  });
  window.addEventListener('mouseup', function () {
    dragging = false;
    viewport.classList.remove('dragging');
  });

  // the machine or context a node stands for, or null: ProB gives the nodes
  // of e.g. the machine hierarchy internal names (dot_node_N), but their
  // tooltip is e.g. "MACHINE M0" and their label shows the name
  var models = %MODELS%;
  function modelOf(node, id) {
    if (models.length === 0) return null;
    var candidates = [id];
    var links = node.querySelectorAll('a');
    for (var j = 0; j < links.length; j++) {
      var tip = links[j].getAttributeNS('http://www.w3.org/1999/xlink', 'title')
        || links[j].getAttribute('xlink:title') || links[j].getAttribute('title') || '';
      var words = tip.trim().split(/\s+/);
      candidates.push(words[words.length - 1]);
    }
    var texts = node.querySelectorAll('text');
    for (var k = 0; k < texts.length; k++)
      candidates.push(texts[k].textContent.trim());
    for (var c = 0; c < candidates.length; c++)
      if (models.indexOf(candidates[c]) >= 0) return candidates[c];
    return null;
  }

  // double-click on a state: ask the plug-in to go there (GraphViz writes
  // the name of a node, the state id, into its <title>); on a machine or
  // context: ask it to open it in its editor
  var nodes = content.querySelectorAll('g.node');
  for (var i = 0; i < nodes.length; i++) {
    var title = nodes[i].querySelector('title');
    var id = title ? title.textContent.trim() : '';
    var open = null, target = id;
    var model = modelOf(nodes[i], id);
    if (%CLICKABLE% && /^(root|-?\d+)$/.test(id))
      open = function (stateId) {
        if (window.probGotoState) window.probGotoState(stateId);
      };
    else if (model !== null) {
      target = model;
      open = function (name) {
        if (window.probOpenModel) window.probOpenModel(name);
      };
    }
    if (open) {
      nodes[i].classList.add('clickable');
      // a double-click would otherwise select the node's text
      nodes[i].addEventListener('mousedown', function (e) {
        if (e.detail > 1) e.preventDefault();
      });
      (function (open, target) {
        nodes[i].addEventListener('dblclick', function (e) {
          e.stopPropagation();
          e.preventDefault();
          open(target);
        });
      })(open, target);
    }
  }

  apply();
  window.probFit();
})();
</script>
</body>
</html>
