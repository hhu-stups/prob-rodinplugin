import groovy.xml.XmlParser

/*
	Build Script can be executed via 'gradle install'
	Build Script Dependencies can be downloaded via 'gradle collectDepenencies'
	Executing the Build Script and download Dependencies can be executed via 'gradle completeInstall'
	For a complete classPath Refresh please execute 'gradle deleteFromClassPath setClassPath'
	Pom Generation can be executed via gradle deploy
*/

apply plugin: 'base'

// Java and Maven version requirements at build time, depending on the major version of Tycho:
// Tycho 5: Java 21, Maven 3.9
// Tycho 4: Java 17, Maven 3.9
// Tycho 3: Java 17, Maven 3.6.3?
// Tycho 2: Java 11, Maven 3.6.3
// Tycho 1: Java 8, Maven 3.0?
// Tycho 0.25: Java 8
// Tycho 0.23: Java 7
// Tycho 0.21: Java 6

// Generally, Tycho can still target Java versions much older than what is required at build time.
// Tycho 5 can target Java 8 and newer.
// Tycho 4 and older can target even older Java versions.
// Since Tycho 3, targeting versions older than Java 11 "is no longer considered first class nor tested".
// Tycho 1.3 was the first version that could target Java 11.
// Tycho 1.1 was the first version that could target Java 9.

project.ext.tychoVersion = "5.0.2"

try {
	dependencyFolder = dependencyFolder
} catch (MissingPropertyException e) {
	project.ext.dependencyFolder = "lib/dependencies/" // Folder in each subproject where
}

try {
	repositoryName = repositoryName
} catch (MissingPropertyException e) {
	project.ext.repositoryName = groupID + ".repository"
}

try {
	parentID = parentID
} catch (MissingPropertyException e) {
	project.ext.parentID = groupID + ".parent"
}


// Add certain Jar to Library
def addLibToCP(File filePar, String libPath) {
	boolean notYetAdded = true
	filePar.eachLine {line ->
		if (line.contains(libPath)) {
			notYetAdded = false
		}
	}
	if (notYetAdded) {
		File newCP = new File("${filePar}.temp")
		filePar.eachLine {line ->
			if (line.contains("</classpath>")) {
				String entry = '\t<classpathentry exported="true" kind="lib" path="' + libPath + '"/>' + '\n</classpath>\n'
				line = line.replaceAll(/<\/classpath>/, entry)
				println "${libPath} added to classpath"
				newCP << line
			} else {
				newCP << line + "\n"
			}
		}
		filePar.delete()
		newCP.renameTo(filePar)
	} else {
		println "${libPath} classpath entry already present"
	}
}

// deletes whole DependenciesLibrary Folder
def deleteLibFromCP(File filePar, String dependencyFolder) {
	boolean deleteCP = false
	def newCP = new File("${filePar}.temp")

	filePar.eachLine {line ->
		if (line ==~ /\n(\ |\t)*/) {
			// delete empty lines
			line = line.replaceAll(/\n(\ |\t)*/, '')
		}
		if (line ==~ /.*${dependencyFolder}[^<].*\/>/) {
			deleteCP = true
			line = line.replaceAll(/(\ |\t)*<classpathentry exported="true" kind="lib" path="${dependencyFolder}[^<].*"\/>(\ |\t)*/, '')
			newCP << line
		} else {
			newCP << line+"\n"
		}
	}
	if (!deleteCP) {
		println "no dependencies from ${dependencyFolder} found in classpath file!"
		newCP.delete()
	} else {
		filePar.delete()
		newCP.renameTo(filePar)
		println "all ${dependencyFolder} entries deleted from classpath file"
	}
}

// Adds a Library to the current Bundle-ClassPath of the Manifest file
def addRunTimeLib(File mf, String libPath) {
	def newMf = new File("${mf}.temp")
	newMf.delete()
	mf.eachLine {line ->
		if (line ==~ /.*Bundle-ClassPath:.*\.jar.*/) {
			def libsInLine = line.replaceAll(/[\ \t]*Bundle-ClassPath:[\ \t]*/, '')
			line = line.replaceFirst(/[^\ \t]*\.jar[\ \,]*/, libPath + ",\n " + libsInLine) // /[^\ \t]*.\.jar[\ \,]*/
		} else if (line ==~ /.*Bundle-ClassPath: \.[\ \t]*/) {
			line = line + ",\n " + libPath
		} else if (line ==~ /.*Bundle-ClassPath: \.\,[\ \t]*/) {
			line = line + "\n " + libPath + ","
		}

		newMf << line + "\n"
	}
	mf.delete()
	newMf.renameTo(mf)
}

// Creates a Bundle-ClassPath Section in the Manifest file
def createRunTimeLib(File mf, String libPath) {
	mf << "Bundle-ClassPath: " + libPath
}

// checks for a Bundle-ClassPath section in the Manifest file
def boolean checkForRunTimeLibs(File mf) {
	boolean returnBool = false
	mf.eachLine {line ->
		if (line.contains("Bundle-ClassPath:")) {
			returnBool = true
		}
	}
	return returnBool
}

// checks if lib is already present in Manifest file
def boolean checkRunTimeLib(File mf, String libPath) {
	boolean returnBool = false
	mf.eachLine {line ->
		if (line.contains(libPath)) {
			returnBool = true
		}
	}
	return returnBool
}

///////////////////////////////////
// !!! DEFINING SUB PROJECTS !!! //
///////////////////////////////////

subprojects {
	apply plugin: 'base'
	apply plugin: 'java'
	// apply plugin: 'eclipse'

	ext {
		pomFile = file("pom.xml")
		dependencyFolder = project.parent.dependencyFolder
		projectDependencyFolder = file(dependencyFolder)
		classpathFile = file(".classpath")
		manifestFile = file("META-INF/MANIFEST.MF")
	}

	try {
		project.isFeature
	} catch (MissingPropertyException e) {
		project.ext.isFeature = project.name ==~ /.*\.[fF]eature/
	}

	if (isFeature) {
		project.ext.featureXmlFile = file("feature.xml")
	}

	task deleteArtifacts(type: Delete) {
		delete 'target', 'pom.xml', projectDependencyFolder
	}

	// Copy Dependencies into subprojects DependencyFolder
	task collectDependencies(type: Copy) {
		from configurations.runtimeClasspath

		into projectDependencyFolder
	}

	task setClassPath(dependsOn: 'collectDependencies') {
		description = "\tAdds all your Dependencies from your local lib folder in each project to it's classpath"

		inputs.property("isFeature", project.isFeature)

		doLast {
			def dependencyList = []
			if (projectDependencyFolder.exists()) {
				projectDependencyFolder.eachFile() {file ->
					dependencyList << file.getName()
				}

				if (!inputs.properties["isFeature"]) {
					boolean BundleClassPathPresent = checkForRunTimeLibs(manifestFile)
					for (int icp = 0; icp < dependencyList.size; icp++) {
						def dependencyPath = dependencyFolder + dependencyList[icp]
						// Adds Lib to .classPath file
						addLibToCP(classpathFile, dependencyPath)

						if (!BundleClassPathPresent) {
							// Adds Lib to Manifest File
							createRunTimeLib(manifestFile, dependencyPath)
							BundleClassPathPresent = true
						} else if (!checkRunTimeLib(manifestFile, dependencyPath)) {
							// if library not present add it to RunTimeLibrary
							addRunTimeLib(manifestFile, dependencyPath)
						}
					}
				}
			}
		}
	}

	task deleteFromClassPath(){
		description = "\tDeletes all your Dependencies located in your local lib folder from each project's classpath"

		inputs.property("isFeature", project.isFeature)

		doLast {
			boolean depsDelete = false
			if (projectDependencyFolder.exists()) {
				depsDelete = true
			}
			projectDependencyFolder.deleteDir()

			if (!inputs.properties["isFeature"] && depsDelete) {
				deleteLibFromCP(classpathFile, dependencyFolder)
			}
		}
	}

	// For a complete classPath Refresh please execute 'gradle deleteFromClassPath setClassPath'

	////////////////////////////////////////////////////////////////////////////////////////////

	task deploy() {
		description = "\tGenerating the Tycho Poms. Please remember to add a '.qualifier' to the version numbers!"

		inputs.property("projectName", project.name)
		inputs.property("isFeature", project.isFeature)

		doLast {
			final projectName = inputs.properties["projectName"]
			String versionNumber = 'Version Number Error:\tcheck Manifest for Bundle-Version Number and make sure to add a ".qualifier" to the version numbers!\n'
			String artifactId = 'Could not find Bundle-SymbolicName in Manifest.file'

			// -- In case of changed Manifest File in Eclipse:
			// Version Numbers of the projects are collected via
			// regular expressions in the Manifest.MF File.
			// versionnumber of the projects are equal to their
			// Bundle-Version Number

			// Generating Poms for sub projects except features
			if (!inputs.properties["isFeature"]) {
				manifestFile.eachLine {
					if (it ==~ /Bundle-Version.+qualifier/) {
						versionNumber = it.substring(16) // possibile error: cuts off first 16 chars

						// Version Number is taken from Bundle-Version in Manifest.MF
						// If there is no Bundle-Version or the versionnumber needs to
						// be taken from a different key word, please change the
						// regular expression and the substring above
						
						versionNumber = versionNumber.replace(".qualifier", "-SNAPSHOT")
					}

					// Artifact ID is taken from Bundle-SymbolicName minus the 16 chars ';singleton:=true'
					if (it ==~ /Bundle-SymbolicName:.+/) {
						artifactId = it
						artifactId = artifactId.replace("Bundle-SymbolicName:", '')
						artifactId = artifactId.replace(";", '')
						artifactId = artifactId.replace(" ", '')
						artifactId = artifactId.replace("singleton:=true", '')
					}
				}

				if (artifactId != projectName) {
					throw new GradleException("The Bundle-SymbolicName declared in the MANIFEST.MF (${artifactId}) must match the Gradle subproject name (${projectName})")
				}

				pomFile.delete()

				if (projectName ==~ /.*\.[tT]ests*/) {
					// Test Cases
					pomFile << start() + elder() + testArtifact(projectName, versionNumber) + end()
				} else {
					// Normal Plugin
					pomFile << start() + elder() + artifact(projectName, versionNumber) + end()
					// old pom.xml files are deleted and replaced by new auto generated Tycho pom.xml files
				}
			} else {
				// Features
				def parsedXml = new XmlParser().parse(featureXmlFile)

				artifactId = parsedXml.attribute("id")
				if (artifactId != projectName) {
					throw new GradleException("The id declared in the feature.xml (${artifactId}) must match the Gradle subproject name (${projectName})")
				}

				versionNumber = parsedXml.attribute("version")
				versionNumber = versionNumber.replace(".qualifier", "-SNAPSHOT")

				pomFile.delete()
				pomFile << feature(projectName, versionNumber)
			}
		}
	}
}


clean {
	dependsOn += subprojects.deleteArtifacts
}

// define Parent
task createParent() {
	doLast {
		def parentDir = new File(parentID)
		parentDir.mkdir()

		def f = new File("${parentDir}/pom.xml")
		f.delete()
		f << parentPom(parentID)
		for (int i = 0; i < targetRepositories.size(); i++) {
			f << repos(targetRepositories[i], i)
		}
		f << endRepos()
		f << moduleStart()
		subprojects.each {subproj ->
			f << module(subproj.name)
		}
		f << module(repositoryName)
		f << endParent()
	}
}

task deleteParent(type: Delete) {
	delete(parentID)
}
clean.dependsOn(deleteParent)

// define Repository
task createRepository() {
	doLast{
		def pom = new File(repositoryName + '/pom.xml')
		pom.delete()
		pom << reposi()
	}
}

task deleteRepository(type: Delete) {
	delete(repositoryName + "/pom.xml")
	delete(repositoryName + "/target")
}
clean.dependsOn(deleteRepository)

task createPoms(dependsOn: [createParent, createRepository, subprojects.deploy])


task install(dependsOn: [createPoms], type: Exec) {
	description = "\tExecutes a 'mvn verify' of the parent pom.xml and auto-generates Tycho Poms"
	commandLine 'mvn', 'verify', '-f', parentID + '/pom.xml'
}

task prepareMaven(dependsOn: [subprojects.collectDependencies, createPoms])

task completeInstall(dependsOn: [prepareMaven], type: Exec) {
	description = "\tCopies dependencies into dependencyFolder of each subproject and executes a 'mvn verify' of the parent pom.xml and auto-generates Tycho Poms"
	commandLine 'mvn', 'verify', '-f', parentID + '/pom.xml'
}


// --- Defining Tycho POM parts -- //


def artifact(artifactId,versionNumber) {"""
	<groupId>${groupID}</groupId>
	<artifactId>${artifactId}</artifactId>
	<version>${versionNumber}</version>
	<packaging>eclipse-plugin</packaging>
"""}

def testArtifact(artifactId,versionNumber) {"""
	<groupId>${groupID}</groupId>
	<artifactId>${artifactId}</artifactId>
	<version>${versionNumber}</version>
	<packaging>eclipse-test-plugin</packaging>
	<build>
		<plugins>
			<plugin>
				<groupId>org.eclipse.tycho</groupId>
				<artifactId>tycho-surefire-plugin</artifactId>
				<version>\${tycho-version}</version>
			</plugin>
		</plugins>
	</build>
"""}


def start() {"""\
<?xml version="1.0" encoding="UTF-8"?>
<project
	xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd" xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
	<modelVersion>4.0.0</modelVersion>
"""}


def elder() {"""
	<parent>
		<groupId>${groupID}</groupId>
		<artifactId>${parentID}</artifactId>
		<version>1.0.0.qualifier</version>
		<relativePath>../${parentID}/pom.xml</relativePath>
	</parent>
"""}


def end() {"""
</project>
"""}

// -- defining Parent Pom -- //

def parentPom(artifactId) {"""\
<?xml version="1.0" encoding="UTF-8"?>
<project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
	<modelVersion>4.0.0</modelVersion>

	<groupId>${groupID}</groupId>
	<artifactId>${artifactId}</artifactId>
	<version>1.0.0.qualifier</version>

	<packaging>pom</packaging>

	<!-- this is the parent POM from which all modules inherit common settings -->
	<properties>
		<project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
		<tycho-version>${tychoVersion}</tycho-version>
		<buildTimeExecutionEnvironment>${buildTimeExecutionEnvironment}</buildTimeExecutionEnvironment>
	</properties>

	<pluginRepositories>
		<pluginRepository>
			<id>central</id>
			<url>https://repo1.maven.org/maven2</url>
		</pluginRepository>
	</pluginRepositories> 
	<repositories>
		<!-- configure p2 repository to resolve against -->
"""}

def repos(String targetRepo, int i) {"""
		<repository>
			<id>targetRepository${i}</id>
			<layout>p2</layout>
			<url>${targetRepo}</url>
		</repository>
"""}

def endRepos() {"""
	</repositories>
	<build>
		<plugins>
			<plugin>
				<groupId>org.eclipse.tycho</groupId>
				<artifactId>target-platform-configuration</artifactId>
				<version>\${tycho-version}</version>
				<configuration>
					<executionEnvironment>\${buildTimeExecutionEnvironment}</executionEnvironment>
				</configuration>
			</plugin>
			<plugin>
				<!-- enable tycho build extension -->
				<groupId>org.eclipse.tycho</groupId>
				<artifactId>tycho-maven-plugin</artifactId>
				<version>\${tycho-version}</version>
				<extensions>true</extensions>
			</plugin>
		</plugins>
	</build>
"""}

def moduleStart() {"""
	<!-- the modules that should be built together -->
	<modules>
"""}

def module(String projectName) {"""\
		<module>../${projectName}</module>
"""}

def endParent() {"""\
	</modules>
</project>
"""}

// end of defining parent pom.xml

// repository Pom
def reposi() {"""\
<?xml version="1.0" encoding="UTF-8"?>
<project
	xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd" xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
	<modelVersion>4.0.0</modelVersion>
	<parent>
		<groupId>${groupID}</groupId>
		<artifactId>${parentID}</artifactId>
		<version>1.0.0.qualifier</version>
		<relativePath>../${parentID}/pom.xml</relativePath>
	</parent>

	<groupId>${groupID}</groupId>
	<artifactId>${repositoryName}</artifactId>
	<version>1.0.0.qualifier</version>
	<packaging>eclipse-repository</packaging>
</project>
"""}

// feature pom
def feature(artifactId, versionNumber) {"""\
<?xml version="1.0" encoding="UTF-8"?>
<project
	xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd" xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
	<modelVersion>4.0.0</modelVersion>
	<parent>
		<groupId>${groupID}</groupId>
		<artifactId>${parentID}</artifactId>
		<version>1.0.0.qualifier</version>
		<relativePath>../${parentID}/pom.xml</relativePath>
	</parent>
	<groupId>${groupID}</groupId>
	<artifactId>${artifactId}</artifactId>
	<version>${versionNumber}</version>
	<packaging>eclipse-feature</packaging>
</project>
"""}
// end of feature pom
